{% extends 'base.html' %}
{% block title %}提交作业 - {{ hw.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card dashboard-card">
            <div class="card-header">提交作业：{{ hw.title }}</div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">文字内容</label>
                        <textarea name="content" class="form-control" rows="5" placeholder="输入你的作业内容..."></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">上传附件（可选）</label>
                        <input type="file" name="file" class="form-control">
                        <div class="form-text">支持上传文档、图片等。单次最大 16MB。</div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('homework_detail', homework_id=hw.id) }}" class="btn btn-secondary">取消返回</a>
                        <button type="submit" class="btn btn-primary">确认提交</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
