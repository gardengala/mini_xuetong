{% extends 'base.html' %}
{% block title %}登录 - 迷你学习通{% endblock %}
{% block content %}
<div class="card shadow-sm auth-card">
    <div class="card-header">账号登录</div>
    <div class="card-body p-4">
        <form method="post" novalidate>
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <input type="text" class="form-control" id="username" name="username" value="{{ username or '' }}" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="remember" name="remember">
                <label class="form-check-label" for="remember">记住我</label>
            </div>
            <button type="submit" class="btn btn-primary w-100">登 录</button>
        </form>
        <hr class="my-4">
        <p class="text-center text-muted mb-0">还没有账号？<a href="{{ url_for('register') }}">立即注册</a></p>
        <p class="text-center text-muted small mt-2 mb-0">测试账号：student1 / 123456 | teacher1 / 123456</p>
    </div>
</div>
{% endblock %}
