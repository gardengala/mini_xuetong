{% extends 'base.html' %}
{% block title %}发布课程 - 迷你学习通{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card dashboard-card">
            <div class="card-header">发布新课程</div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label for="name" class="form-label">课程名称 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" name="name" maxlength="100" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">课程简介</label>
                        <textarea class="form-control" id="description" name="description" rows="4"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">提交发布</button>
                    <a href="{{ url_for('course_list') }}" class="btn btn-secondary ms-2">取消</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
